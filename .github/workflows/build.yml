name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: "30.0.14904198"
  CMAKE_VERSION: "3.22.1"
  ANDROID_API: "34"
  BUILD_TOOLS: "34.0.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set SDK location
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          mkdir -p "$HOME/android-sdk"

      - name: Cache Android SDK, NDK and CMake
        uses: actions/cache@v4
        with:
          path: ~/android-sdk
          key: android-sdk-ndk${{ env.NDK_VERSION }}-cmake${{ env.CMAKE_VERSION }}-api${{ env.ANDROID_API }}-v1

      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT_SYSTEM/cmdline-tools/latest/bin/sdkmanager"
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$HOME/android-sdk" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$HOME/android-sdk" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"

      - name: Cache CMake and raylib build
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}
          restore-keys: |
            cxx-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZoneWars-debug
          path: app/build/outputs/apk/debug/*.apk